version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 4
    # These direct dependencies form one ABI-sensitive compatibility stack.
    groups:
      polars-rust:
        patterns:
          - polars
          - polars-arrow
          - pyo3
          - pyo3-polars

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 4
    groups:
      python-dev-tools:
        patterns:
          - maturin
          - mypy
          - pytest
          - ruff
          - twine

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 4
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 4

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 4
