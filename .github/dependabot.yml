version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 4
    groups:
      polars-rust:
        patterns:
          - polars
          - pyo3-polars

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 4

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 4

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 4

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 4
