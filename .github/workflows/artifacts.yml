name: Artifacts

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - LICENSE
      - maxminddb_polars/**
      - pyproject.toml
      - scripts/inspect_artifacts.py
      - src/**
      - uv.lock
      - .github/workflows/artifacts.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - LICENSE
      - maxminddb_polars/**
      - pyproject.toml
      - scripts/inspect_artifacts.py
      - src/**
      - uv.lock
      - .github/workflows/artifacts.yml

permissions:
  contents: read

concurrency:
  group: artifacts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  wheels:
    name: Wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: auto
            smoke: true
          - platform: manylinux-aarch64
            os: ubuntu-latest
            target: aarch64
            manylinux: auto
            smoke: false
          - platform: musllinux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
            smoke: false
          - platform: musllinux-aarch64
            os: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
            smoke: false
          - platform: macos-x86_64
            os: macos-15-intel
            target: x86_64
            manylinux: auto
            smoke: true
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64
            manylinux: auto
            smoke: true
          - platform: windows-x86_64
            os: windows-latest
            target: x64
            manylinux: auto
            smoke: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678e61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        if: runner.os == 'Linux' && matrix.target == 'aarch64'
        with:
          platforms: arm64
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Smoke-test native wheel
        if: matrix.smoke
        shell: bash
        run: |
          python -m pip install "polars>=1.43,<1.44"
          python - <<'PY'
          import glob
          import subprocess
          import sys

          subprocess.check_call(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  "--no-index",
                  "--no-deps",
                  *glob.glob("dist/*.whl"),
              ]
          )
          PY
          test_directory=$(mktemp -d)
          cd "$test_directory"
          python - <<'PY'
          import importlib.metadata

          import polars as pl

          from maxminddb_polars import _maxminddb_polars
          from maxminddb_polars._internal import identity

          result = pl.DataFrame({"value": ["127.0.0.1"]}).lazy().select(identity("value")).collect()
          assert result.to_dict(as_series=False) == {"value": ["127.0.0.1"]}
          assert _maxminddb_polars.__version__ == importlib.metadata.version("maxminddb-polars")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  abi3:
    name: abi3 / Python ${{ matrix.python }} / Polars ${{ matrix.polars }}
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            polars: "1.43.0"
          - python: "3.14"
            polars: "1.43.2"
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678e61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-manylinux-x86_64
          path: dist
      - name: Install exact wheel
        env:
          POLARS_VERSION: ${{ matrix.polars }}
        shell: bash
        run: |
          python -m pip install "polars==$POLARS_VERSION"
          python -m pip install --no-index --no-deps dist/*.whl
      - name: Smoke-test abi3 wheel
        shell: bash
        run: |
          test_directory=$(mktemp -d)
          cd "$test_directory"
          python - <<'PY'
          import importlib.metadata

          import polars as pl

          from maxminddb_polars import _maxminddb_polars
          from maxminddb_polars._internal import identity

          result = pl.DataFrame({"value": ["127.0.0.1"]}).lazy().select(identity("value")).collect(engine="streaming")
          assert result.to_dict(as_series=False) == {"value": ["127.0.0.1"]}
          assert _maxminddb_polars.__version__ == importlib.metadata.version("maxminddb-polars")
          PY

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678e61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv sync --all-extras --locked --no-install-project
      - run: uv run --no-sync maturin sdist --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  validate:
    name: Validate distributions
    needs: [wheels, abi3, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678e61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist
      - run: python scripts/inspect_artifacts.py dist/*
      - name: Verify locked source state
        run: |
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          uv lock --check
          test "$(git -C tests/data rev-parse HEAD)" = "e1120013c4b5cbc830b958b2b7e73fba444d316d"
          git diff --exit-code
      - run: python -m pip install twine==6.2.0
      - run: python -m twine check --strict dist/*
      - name: Build and smoke-test from sdist
        shell: bash
        run: |
          python -m pip install "polars>=1.43,<1.44"
          python -m pip wheel --no-deps --wheel-dir sdist-wheel dist/*.tar.gz
          python scripts/inspect_artifacts.py sdist-wheel/*.whl
          python -m pip install --no-index --no-deps sdist-wheel/*.whl
          test_directory=$(mktemp -d)
          cd "$test_directory"
          python - <<'PY'
          import importlib.metadata

          import polars as pl

          from maxminddb_polars import _maxminddb_polars
          from maxminddb_polars._internal import identity

          result = pl.DataFrame({"value": ["127.0.0.1"]}).select(identity("value"))
          assert result.to_dict(as_series=False) == {"value": ["127.0.0.1"]}
          assert _maxminddb_polars.__version__ == importlib.metadata.version("maxminddb-polars")
          PY
      - name: Write checksums
        run: sha256sum dist/* >SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publishable-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-checksums
          path: SHA256SUMS
          if-no-files-found: error
          retention-days: 30
