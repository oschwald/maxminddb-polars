name: Artifacts

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - LICENSE
      - maxminddb_polars/**
      - pyproject.toml
      - scripts/*.py
      - src/**
      - uv.lock
      - .github/workflows/artifacts.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - LICENSE
      - maxminddb_polars/**
      - pyproject.toml
      - scripts/*.py
      - src/**
      - uv.lock
      - .github/workflows/artifacts.yml

permissions:
  contents: read

concurrency:
  group: artifacts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  wheels:
    name: Wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: auto
            smoke: true
          - platform: manylinux-aarch64
            os: ubuntu-latest
            target: aarch64
            manylinux: auto
            smoke: false
          - platform: musllinux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
            smoke: false
          - platform: musllinux-aarch64
            os: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
            smoke: false
          - platform: macos-x86_64
            os: macos-15-intel
            target: x86_64
            manylinux: auto
            smoke: true
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64
            manylinux: auto
            smoke: true
          - platform: windows-x86_64
            os: windows-latest
            target: x64
            manylinux: auto
            smoke: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: runner.os == 'Linux' && matrix.target == 'aarch64'
        with:
          platforms: arm64
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Smoke-test native wheel
        if: matrix.smoke
        shell: bash
        run: |
          python -m pip install --no-index --no-deps dist/*.whl
          for polars_version in 1.43.2 1.44.1 1.44.2 2.0.0; do
            python -m pip install "polars==$polars_version"
            python scripts/smoke_wheel.py
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  abi3:
    name: abi3 / Python ${{ matrix.python }} / Polars ${{ matrix.polars }}
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
        polars: ["1.43.2", "1.44.1", "1.44.2", "2.0.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-manylinux-x86_64
          path: dist
      - name: Install exact wheel
        env:
          POLARS_VERSION: ${{ matrix.polars }}
        shell: bash
        run: |
          python -m pip install "polars==$POLARS_VERSION"
          python -m pip install --no-index --no-deps dist/*.whl
      - name: Smoke-test abi3 wheel
        shell: bash
        run: |
          python scripts/smoke_wheel.py

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --all-extras --locked --no-install-project
      - run: uv run --no-sync maturin sdist --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  validate:
    name: Validate distributions
    needs: [wheels, abi3, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - run: python scripts/inspect_artifacts.py dist/*
      - name: Verify locked source state
        run: |
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          uv lock --check
          test "$(git -C tests/data rev-parse HEAD)" = "0ee49278e35fd7bdf341ac236edbba20de1aceb9"
          git diff --exit-code
      - run: python -m pip install twine==7.0.0
      - run: python -m twine check --strict dist/*
      - name: Build and smoke-test from sdist
        shell: bash
        run: |
          python -m pip wheel --no-deps --wheel-dir sdist-wheel dist/*.tar.gz
          python scripts/inspect_artifacts.py sdist-wheel/*.whl
          python -m pip install --no-index --no-deps sdist-wheel/*.whl
          for polars_version in 1.44.2 2.0.0; do
            python -m pip install "polars==$polars_version"
            python scripts/smoke_wheel.py
          done
      - name: Write checksums
        run: sha256sum dist/* >SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publishable-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-checksums
          path: SHA256SUMS
          if-no-files-found: error
          retention-days: 30
