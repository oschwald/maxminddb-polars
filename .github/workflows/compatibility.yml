name: Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "31 16 1 * *"
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - pyproject.toml
      - uv.lock
      - .github/workflows/compatibility.yml

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supported:
    name: Python ${{ matrix.python }} / Polars ${{ matrix.polars }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POLARS_VERSION: ${{ matrix.polars }}
      PYTHON_VERSION: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        polars: ["1.43.2", "1.44.1", "1.44.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: >-
          uv sync --python "$PYTHON_VERSION" --all-extras --locked
          --no-install-project
      - run: uv pip install --python .venv/bin/python "polars==$POLARS_VERSION"
      - run: uv run --no-sync maturin develop
      - run: uv run --no-sync pytest
