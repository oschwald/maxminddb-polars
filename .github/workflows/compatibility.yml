name: Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "31 16 1 * *"
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - pyproject.toml
      - uv.lock
      - .github/workflows/compatibility.yml

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supported:
    name: Python ${{ matrix.python }} / Polars ${{ matrix.polars }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POLARS_VERSION: ${{ matrix.polars }}
      PYTHON_VERSION: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        polars: ["1.43.2", "1.44.1", "1.44.2", "2.0.0", "2.1.0"]
        exclude:
          # Polars 2.1 requires Python 3.11 or later.
          - python: "3.10"
            polars: "2.1.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: >-
          uv sync --python "$PYTHON_VERSION" --all-extras --locked
          --no-install-project
      - run: uv pip install --python .venv/bin/python "polars==$POLARS_VERSION"
      - run: uv run --no-sync maturin develop
      - run: uv run --no-sync pytest
