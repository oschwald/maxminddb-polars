name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - fuzz/**
      - src/**
      - .github/workflows/fuzz.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - fuzz/**
      - src/**
      - .github/workflows/fuzz.yml
  schedule:
    - cron: "31 16 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz smoke corpus
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_FUZZ_VERSION: "0.13.2"
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Seed database targets
        shell: bash
        run: |
          mkdir -p fuzz/corpus/projected_value fuzz/corpus/malformed_database
          cp tests/data/test-data/GeoIP2-City-Test.mmdb fuzz/corpus/projected_value/
          find tests/data/bad-data -name '*.mmdb' -exec cp {} fuzz/corpus/malformed_database/ \;
      - name: Run bounded fuzz targets
        shell: bash
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '120' || '10' }}
        run: |
          for target in kwargs_deserialization path_traversal projected_value malformed_database; do
            cargo fuzz run "$target" -- \
              -max_len=8388608 \
              -max_total_time="$FUZZ_SECONDS"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzzing-artifacts-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
