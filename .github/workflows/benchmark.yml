name: Benchmark

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:
    inputs:
      rows:
        description: Rows per sample
        required: true
        default: "100000"
      repeats:
        description: Measured samples
        required: true
        default: "7"

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lookups:
    name: Lookup benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --all-extras --locked --no-install-project
      - run: CARGO_BUILD_JOBS=1 uv run --no-sync maturin develop --release --locked
      - name: Run benchmark
        env:
          BENCHMARK_REPEATS: ${{ inputs.repeats || '7' }}
          BENCHMARK_ROWS: ${{ inputs.rows || '100000' }}
          POLARS_MAX_THREADS: "1"
        run: >-
          uv run --no-sync python benchmarks/lookups.py
          --rows "$BENCHMARK_ROWS"
          --repeats "$BENCHMARK_REPEATS"
          --engine in-memory
          --enforce-gates
          --json benchmark-results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-results
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 30
