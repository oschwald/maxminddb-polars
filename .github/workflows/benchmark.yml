name: Benchmark

on:
  workflow_dispatch:
    inputs:
      rows:
        description: Rows per sample
        required: true
        default: "500000"
      repeats:
        description: Measured samples
        required: true
        default: "7"

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lookups:
    name: Lookup benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv sync --all-extras --locked
      - name: Run benchmark
        env:
          BENCHMARK_REPEATS: ${{ inputs.repeats }}
          BENCHMARK_ROWS: ${{ inputs.rows }}
        run: >-
          uv run --no-sync python benchmarks/lookups.py
          --rows "$BENCHMARK_ROWS"
          --repeats "$BENCHMARK_REPEATS"
          --json benchmark-results.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-results
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 30
