name: Benchmark

on:
  workflow_dispatch:
    inputs:
      rows:
        description: Rows per sample
        required: true
        default: "500000"
      repeats:
        description: Measured samples
        required: true
        default: "7"

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lookups:
    name: Lookup benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --all-extras --locked --no-install-project
      - run: uv run --no-sync maturin develop
      - name: Run benchmark
        env:
          BENCHMARK_REPEATS: ${{ inputs.repeats }}
          BENCHMARK_ROWS: ${{ inputs.rows }}
        run: >-
          uv run --no-sync python benchmarks/lookups.py
          --rows "$BENCHMARK_ROWS"
          --repeats "$BENCHMARK_REPEATS"
          --json benchmark-results.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-results
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 30
