name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read and validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          if [[ "$EVENT_NAME" == "release" ]]; then
            test "$RELEASE_TAG" = "v$version"
            test "$version" != "0.0.0"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Verify clean source metadata
        run: |
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          git diff --exit-code

  artifacts:
    name: Build and validate artifacts
    needs: validate
    uses: ./.github/workflows/artifacts.yml
    permissions:
      contents: read

  crate:
    name: Package and validate crate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - run: cargo publish --dry-run --locked

  publish-crate:
    name: Publish to crates.io
    if: github.event_name == 'release'
    needs: [validate, artifacts, crate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "1"
    environment:
      name: release
      url: https://crates.io/crates/maxminddb-polars
    permissions:
      contents: read
      # Authenticate to crates.io through OpenID Connect trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Check for an existing crate version
        id: crate-state
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          status=$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --user-agent "maxminddb-polars-release/$VERSION (https://github.com/oschwald/maxminddb-polars)" \
            --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/maxminddb-polars/$VERSION")
          case "$status" in
            200)
              echo "exists=true" >>"$GITHUB_OUTPUT"
              ;;
            404)
              echo "exists=false" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected crates.io response: HTTP $status" >&2
              exit 1
              ;;
          esac
      - name: Authenticate with crates.io
        if: steps.crate-state.outputs.exists != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish to crates.io
        if: steps.crate-state.outputs.exists != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Verify crates.io publication
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          for ((attempt = 0; attempt < 30; attempt++)); do
            status=$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --user-agent "maxminddb-polars-release/$VERSION (https://github.com/oschwald/maxminddb-polars)" \
              --output /dev/null --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/maxminddb-polars/$VERSION")
            if [[ "$status" == 200 ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "crates.io did not expose the expected package version" >&2
          exit 1

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [validate, artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/maxminddb-polars
    permissions:
      # Authenticate to PyPI through OpenID Connect trusted publishing.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publishable-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist

  verify-publish:
    name: Verify published packages
    if: github.event_name == 'release'
    needs: [validate, publish-crate, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install published version
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: python -m pip install --only-binary maxminddb-polars "maxminddb-polars==$VERSION"
      - name: Smoke-test published wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -I - <<'PY'
          import os
          from pathlib import Path

          import polars as pl
          import maxminddb_polars

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          module = Path(maxminddb_polars.__file__).resolve()
          assert not module.is_relative_to(workspace), f"imported checkout source: {module}"
          database = Path(os.environ["GITHUB_WORKSPACE"]) / "tests/data/test-data/GeoIP2-City-Test.mmdb"
          result = pl.DataFrame({"ip": ["89.160.20.128"]}).select(
              maxminddb_polars.lookup_path("ip", database, ["country", "iso_code"]).alias("country")
          )
          assert result.to_dict(as_series=False) == {"country": ["SE"]}
          PY
