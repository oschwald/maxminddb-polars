[package]
name = "maxminddb-polars"
version = "0.0.0"
edition = "2024"
authors = ["Gregory Oschwald <oschwald@gmail.com>"]
description = "Fast Polars expressions for MaxMind DB lookups"
license = "ISC"
repository = "https://github.com/oschwald/maxminddb-polars"
keywords = ["maxmind", "geoip", "mmdb", "polars"]
categories = ["database", "api-bindings"]
publish = false

[lib]
name = "_maxminddb_polars"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
maxminddb = { version = "=0.30.0", features = ["simdutf8"] }
polars = { version = "=0.54.4", default-features = false, features = [
    "dtype-i8",
    "dtype-i16",
    "dtype-i128",
    "dtype-struct",
    "dtype-u8",
    "dtype-u16",
    "dtype-u128",
] }
polars-arrow = { version = "=0.54.4", default-features = false }
pyo3 = { version = "=0.28.3", features = ["abi3-py310"] }
pyo3-polars = { version = "=0.27.0", features = ["derive", "dtype-struct"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
