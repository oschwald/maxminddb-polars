exclude = [
  ".git/**/*",
  ".mypy_cache/**/*",
  ".pytest_cache/**/*",
  ".ruff_cache/**/*",
  ".venv/**/*",
  "dist/**/*",
  "target/**/*",
  "tests/data/**/*",
]

[commands.clippy]
type = "lint"
include = "**/*.rs"
invoke = "once"
path-args = "none"
cmd = [
  "cargo",
  "clippy",
  "--all-targets",
  "--all-features",
  "--locked",
  "--",
  "-D",
  "warnings",
]
ok-exit-codes = [0]
lint-failure-exit-codes = [101]
expect-stderr = true

[commands.rustfmt]
type = "both"
include = "**/*.rs"
invoke = "once"
path-args = "none"
cmd = ["cargo", "fmt", "--all"]
lint-flags = "--check"
ok-exit-codes = [0]
lint-failure-exit-codes = [1]

[commands.ruff-lint]
type = "both"
include = "**/*.py"
invoke = "once"
path-args = "dot"
cmd = [".venv/bin/ruff", "check"]
tidy-flags = "--fix"
ok-exit-codes = [0]
lint-failure-exit-codes = [1]

[commands.ruff-format]
type = "both"
include = "**/*.py"
invoke = "once"
path-args = "dot"
cmd = [".venv/bin/ruff", "format"]
lint-flags = "--check"
ok-exit-codes = [0]
lint-failure-exit-codes = [1]

[commands.mypy]
type = "lint"
include = "**/*.py"
invoke = "once"
path-args = "none"
cmd = [".venv/bin/mypy"]
ok-exit-codes = [0]
lint-failure-exit-codes = [1]

[commands.prettier]
type = "both"
include = ["**/*.md", "**/*.yml", "**/*.yaml"]
invoke = "once"
path-args = "file"
cmd = ["prettier"]
lint-flags = "--check"
tidy-flags = "--write"
ok-exit-codes = [0]
lint-failure-exit-codes = [1]
expect-stderr = true

